services:
  frontend:
    image: ${COMPOSE_PROJECT_NAME:-maple_hush_frontend}-frontend:${FRONTEND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: scripts/deploy/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.30-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    stop_grace_period: 15s
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-8090}:8080"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:?Set the reachable backend origin in .env}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
    healthcheck:
      test: [CMD-SHELL, "wget -q -T 4 -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
