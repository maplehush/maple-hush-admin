# Only the two explicit placeholders are replaced at container startup.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 3m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    geo $realip_remote_addr $trusted_gateway {
        default 0;
        ${TRUSTED_PROXY_CIDR} 1;
    }
    map "$trusted_gateway:$http_x_forwarded_proto" $public_scheme {
        default $scheme;
        "1:https" https;
        "1:http" http;
    }
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        # No URI suffix: /api is forwarded exactly once, including query strings.
        location ~ ^/api(?:/|$) {
            proxy_pass ${BACKEND_UPSTREAM};
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 4;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_cache off;
            proxy_redirect off;
        }
        location = /index.html {
            add_header Cache-Control "no-store" always;
        }
        # Vite emits content hashes in these directories.
        location ~ ^/(?:js|jse|css|woff2?|png|svg)/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ ^/_app-config-.*\.js$ {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
        }
        # Missing assets must not return index.html as JavaScript/CSS.
        location ~* \.(?:js|mjs|css|map|json|ico|png|jpe?g|gif|svg|webp|woff2?|ttf)$ {
            try_files $uri =404;
        }
        location ~ /\. { return 404; }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store" always;
        }
    }
}
