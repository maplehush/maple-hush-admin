<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 528" role="img" aria-labelledby="title desc">
<title id="title">后端模块依赖图</title><desc id="desc">admin-system-start 依赖 admin-system-biz；biz 分别依赖 admin-base-core 和 admin-system-api；api 无项目模块依赖。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3b82f6"/></marker></defs>
<rect width="420" height="528" rx="16" fill="#f1f5f9"/>
<g font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, sans-serif"><rect x="40" y="28" width="340" height="72" rx="12" fill="#ffffff" stroke="#94a3b8"/><text x="210.0" y="56" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="600">admin-system-start</text><text x="210.0" y="79" text-anchor="middle" fill="#475569" font-size="13">启动与装配 · 唯一可执行 Jar</text><path d="M210 100 L210 146" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="150" width="340" height="72" rx="12" fill="#ffffff" stroke="#94a3b8"/><text x="210.0" y="178" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="600">admin-system-biz</text><text x="210.0" y="201" text-anchor="middle" fill="#475569" font-size="13">HTTP 接口 · 系统业务</text><rect x="64" y="276" width="316" height="72" rx="12" fill="#ffffff" stroke="#94a3b8"/><text x="222.0" y="304" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="600">admin-base-core</text><text x="222.0" y="327" text-anchor="middle" fill="#475569" font-size="13">公共技术能力</text><rect x="64" y="394" width="316" height="72" rx="12" fill="#ffffff" stroke="#94a3b8"/><text x="222.0" y="422" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="600">admin-system-api</text><text x="222.0" y="445" text-anchor="middle" fill="#475569" font-size="13">内部 Java 契约 · 无项目模块依赖</text><path d="M40 186 L20 186 L20 312 L64 312" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/><path d="M20 312 L20 430 L64 430" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/><text x="210" y="505" text-anchor="middle" fill="#475569" font-size="13">箭头表示 Maven 项目模块依赖</text></g>
