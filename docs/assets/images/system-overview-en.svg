<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 668" role="img" aria-labelledby="title desc">
<title id="title">System Overview</title><desc id="desc">The browser reaches Spring Boot through the frontend same-origin API. The backend accesses MySQL, Redis, and Alibaba Cloud OSS.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3b82f6"/></marker></defs>
<rect width="420" height="668" rx="16" fill="#f1f5f9"/>
<g font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, sans-serif"><rect x="60" y="24" width="300" height="72" rx="12" fill="#ffffff" stroke="#94a3b8"/><text x="210.0" y="52" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="600">Browser Application</text><text x="210.0" y="75" text-anchor="middle" fill="#475569" font-size="13">Vue: pages, routing, interactions</text><path d="M210 96 L210 132" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="136" width="300" height="72" rx="12" fill="#ffffff" stroke="#94a3b8"/><text x="210.0" y="164" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="600">Frontend Entry Point</text><text x="210.0" y="187" text-anchor="middle" fill="#475569" font-size="13">Vite dev server / Nginx static assets</text><path d="M210 208 L210 244" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="248" width="300" height="72" rx="12" fill="#ffffff" stroke="#94a3b8"/><text x="210.0" y="276" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="600">Spring Boot Backend</text><text x="210.0" y="299" text-anchor="middle" fill="#475569" font-size="13">Auth, business rules, data access</text><text x="228" y="233" fill="#475569" font-size="13">/api</text><path d="M40 284 L40 396 L60 396" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="360" width="300" height="72" rx="12" fill="#ffffff" stroke="#94a3b8"/><text x="210.0" y="388" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="600">MySQL</text><text x="210.0" y="411" text-anchor="middle" fill="#475569" font-size="13">Persistent business and session data</text><path d="M40 284 L40 502 L60 502" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="466" width="300" height="72" rx="12" fill="#ffffff" stroke="#94a3b8"/><text x="210.0" y="494" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="600">Redis</text><text x="210.0" y="517" text-anchor="middle" fill="#475569" font-size="13">CAPTCHA, rate limiting, cache</text><path d="M40 284 L40 608 L60 608" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="572" width="300" height="72" rx="12" fill="#ffffff" stroke="#94a3b8"/><text x="210.0" y="600" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="600">Alibaba Cloud OSS</text><text x="210.0" y="623" text-anchor="middle" fill="#475569" font-size="13">Avatar and image objects</text><path d="M60 284 L40 284" fill="none" stroke="#3b82f6" stroke-width="2"/></g>
</svg>