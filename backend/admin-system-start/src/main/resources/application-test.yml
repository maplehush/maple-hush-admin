spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE}
      timeout: 5s
      password: ${REDIS_PASSWORD}
maple-hush:
  redis:
    key-prefix: ${REDIS_KEY_PREFIX}
  auth:
    jwt-secret: ${AUTH_JWT_SECRET}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS}

# 测试环境开放接口文档；认证写请求仍要求配置可信公开 Origin。
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    persist-authorization: false
  paths-to-match: /api/**
  default-produces-media-type: application/json
  override-with-generic-response: false
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: false
