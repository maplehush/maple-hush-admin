spring:
  application:
    name: maple-hush-admin
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  mvc:
    problemdetails:
      enabled: false
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  endpoints:
    web:
      exposure:
        include: health
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
logging:
  pattern:
    level: "%5p [traceId=%X{traceId}]"
maple-hush:
  auth:
    bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    jwt-secret: ${AUTH_JWT_SECRET:}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:}
    session-retention-days: ${AUTH_SESSION_RETENTION_DAYS:7}
    session-cleanup-delay-ms: ${AUTH_SESSION_CLEANUP_DELAY_MS:3600000}
    user-snapshot-ttl-seconds: ${AUTH_USER_SNAPSHOT_TTL_SECONDS:600}
  log:
    login-retention-days: ${LOG_LOGIN_RETENTION_DAYS:90}
    operation-retention-days: ${LOG_OPERATION_RETENTION_DAYS:180}
    cleanup-enabled: ${LOG_CLEANUP_ENABLED:true}
    cleanup-delay-ms: ${LOG_CLEANUP_DELAY_MS:3600000}
  oss:
    region: ${OSS_REGION:oss-cn-beijing}
    bucket: ${OSS_BUCKET:maple-hush}
    public-domain: ${OSS_PUBLIC_DOMAIN:https://maple-hush.oss-cn-beijing.aliyuncs.com}
    object-prefix: ${OSS_OBJECT_PREFIX:vben-admin-img/}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    security-token: ${OSS_SECURITY_TOKEN:}
