spring:
  application:
    name: maple-hush-admin
  jackson:
    time-zone: Asia/Shanghai
  mvc:
    problemdetails:
      enabled: false
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  endpoints:
    web:
      exposure:
        include: health
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
logging:
  pattern:
    level: "%5p [traceId=%X{traceId}]"
maple-hush:
  auth:
    bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    jwt-secret: ${AUTH_JWT_SECRET:}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:}
    session-retention-days: ${AUTH_SESSION_RETENTION_DAYS:7}
    session-cleanup-delay-ms: ${AUTH_SESSION_CLEANUP_DELAY_MS:3600000}
    user-snapshot-ttl-seconds: ${AUTH_USER_SNAPSHOT_TTL_SECONDS:600}
  log:
    login-retention-days: ${LOG_LOGIN_RETENTION_DAYS:90}
    operation-retention-days: ${LOG_OPERATION_RETENTION_DAYS:180}
    cleanup-enabled: ${LOG_CLEANUP_ENABLED:true}
    cleanup-delay-ms: ${LOG_CLEANUP_DELAY_MS:3600000}
