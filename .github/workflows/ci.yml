name: Project checks

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint apps/web-antdv-next/src --quiet
      - run: pnpm exec oxfmt --check apps/web-antdv-next/src
      - run: pnpm --filter @vben/web-antdv-next typecheck
      - run: pnpm exec vitest run apps/web-antdv-next/src --dom
      - run: pnpm --filter @vben/web-antdv-next build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - run: bash mvnw -B -ntp verify

  build-and-push:
    name: Build and Push Docker Images

    # 只有代码 Push 事件才允许推送镜像。
    # Pull Request 只进行代码检查，不推送镜像。
    if: github.event_name == 'push'

    # 必须等待前端和后端检查全部成功。
    needs:
      - frontend
      - backend

    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TCR_REGISTRY: ccr.ccs.tencentyun.com
      TCR_NAMESPACE: maplehush

    steps:
      # 获取项目代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 正式版本 Tag 必须符合 vMAJOR.MINOR.PATCH，且高于仓库已有的最高正式版本。
      # 校验失败会终止当前 Job，后续 Docker 构建和 TCR 推送不会执行。
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          current_tag="${GITHUB_REF_NAME}"
          version_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)

      # 登录腾讯云 TCR
      - name: Login to Tencent Cloud TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      # 生成前端镜像标签
      - name: Docker Metadata - Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/maple-hush-admin-frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      # 生成后端镜像标签
      - name: Docker Metadata - Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/maple-hush-admin-backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      # 构建并推送前端镜像
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/scripts/deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # 构建并推送后端镜像
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

          if [[ ! "${current_tag}" =~ ${version_regex} ]]; then
            echo "::error title=Invalid release tag::Tag '${current_tag}' must use vMAJOR.MINOR.PATCH, for example v1.5.7."
            exit 1
          fi
          git fetch --force --tags origin
          latest_tag="$(git tag --list 'v*' | grep -E "${version_regex}" | grep -Fxv "${current_tag}" | sort -V | tail -n 1 || true)"
          if [[ -n "${latest_tag}" ]]; then
            highest_tag="$(printf '%s\n%s\n' "${latest_tag}" "${current_tag}" | sort -V | tail -n 1)"
            if [[ "${highest_tag}" != "${current_tag}" ]]; then
              echo "::error title=Release version rejected::${current_tag} must be greater than the latest existing stable release ${latest_tag}."
              exit 1
            fi
          fi
          echo "Release version accepted: ${current_tag}"
      # 配置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录腾讯云 TCR
      - name: Login to Tencent Cloud TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      # 生成前端镜像标签
      - name: Docker Metadata - Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/maple-hush-admin-frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      # 生成后端镜像标签
      - name: Docker Metadata - Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/maple-hush-admin-backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      # 构建并推送前端镜像
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/scripts/deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # 构建并推送后端镜像
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
