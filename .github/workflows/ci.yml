name: Project checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint apps/web-antdv-next/src --quiet
      - run: pnpm exec oxfmt --check apps/web-antdv-next/src
      - run: pnpm --filter @vben/web-antdv-next typecheck
      - run: pnpm exec vitest run apps/web-antdv-next/src --dom
      - run: pnpm --filter @vben/web-antdv-next build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - run: bash mvnw -B -ntp verify
