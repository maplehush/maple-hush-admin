name: Project checks

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.node-version
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
          run_install: false
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint apps/web-antdv-next/src --quiet
      - run: pnpm exec oxfmt --check apps/web-antdv-next/src
      - run: pnpm --filter @vben/web-antdv-next typecheck
      - run: pnpm exec vitest run apps/web-antdv-next/src --dom
      - run: pnpm --filter @vben/web-antdv-next build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - run: bash mvnw -B -ntp verify

  build-and-push:
    name: Build and Push Docker Images

    # 只有代码 Push 事件才允许推送镜像。
    # Pull Request 只进行代码检查，不推送镜像。
    if: github.event_name == 'push'

    # 必须等待前端和后端检查全部成功。
    needs:
      - frontend
      - backend

    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TCR_REGISTRY: ccr.ccs.tencentyun.com
      TCR_NAMESPACE: maplehush

    steps:
      # 获取项目代码
      - name: Checkout code
        uses: actions/checkout@v5

      # 正式版本校验：只限制镜像发布，不阻止 Git Tag 创建。
      - name: Validate Release Version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG="${GITHUB_REF_NAME}"
          VERSION_REGEX='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          # 1. 检查版本格式
          if [[ ! "$CURRENT_TAG" =~ $VERSION_REGEX ]]; then
            echo "::error::版本格式错误：$CURRENT_TAG"
            exit 1
          fi

          # 2. 只读取远程 Tag，避免浅克隆检出与附注 Tag 的本地引用冲突。
          # 单独读取：远程访问失败时立即停止，不按“没有历史版本”处理。
          REMOTE_TAG_REFS=$(git ls-remote --tags --refs origin)

          # 3. 找到已有的最高正式版本，排除当前 Tag 以支持重跑
          LATEST_TAG=$(
            printf '%s\n' "$REMOTE_TAG_REFS" |
            cut -f 2 |
            sed 's#^refs/tags/##' |
            grep -E "$VERSION_REGEX" |
            grep -Fxv "$CURRENT_TAG" |
            sort -V |
            tail -n 1 || true
          )

          # 4. 检查版本是否递增
          if [[ -n "$LATEST_TAG" ]]; then
            HIGHEST_TAG=$(
              printf '%s\n%s\n' "$LATEST_TAG" "$CURRENT_TAG" |
              sort -V |
              tail -n 1
            )

            if [[ "$HIGHEST_TAG" != "$CURRENT_TAG" ]]; then
              echo "::error::版本必须高于最新正式版本 $LATEST_TAG"
              exit 1
            fi
          fi

          echo "版本校验通过：$CURRENT_TAG"

      # 配置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 登录腾讯云 TCR
      - name: Login to Tencent Cloud TCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      # 生成前端镜像标签
      - name: Docker Metadata - Frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/maple-hush-admin-frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      # 生成后端镜像标签
      - name: Docker Metadata - Backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/maple-hush-admin-backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      # 构建并推送前端镜像
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/scripts/deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # 构建并推送后端镜像
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
